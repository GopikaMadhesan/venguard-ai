<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents | VenGuard AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Poppins;
        }

        .container{
            margin-top:50px;
        }

        table{
            background:#1e293b;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1 class="text-info mb-4">
            VenGuard AI Documents
        </h1>

        <table class="table table-dark table-hover">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Vendor ID</th>

                    <th>Document</th>

                    <th>File</th>

                </tr>

            </thead>

            <tbody>

                {% for doc in documents %}

                <tr>

                    <td>{{ doc[0] }}</td>

                    <td>{{ doc[1] }}</td>

                    <td>{{ doc[2] }}</td>

                    <td>

                        <a href="/{{ doc[3] }}"
                            class="btn btn-info btn-sm"
                            target="_blank">

                            View

                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>

</html>
