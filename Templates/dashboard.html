<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VenGuard AI Dashboard</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Chart.js -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            margin:0;
            font-family:'Poppins',sans-serif;
            background:#0f172a;
            color:white;
        }

        /* SIDEBAR */

        .sidebar{
            width:250px;
            height:100vh;
            background:#020617;
            position:fixed;
            padding:30px 20px;
            overflow:auto;
        }

        .sidebar h2{
            color:#38bdf8;
            font-weight:700;
        }

        .sidebar p{
            color:#94a3b8;
            font-size:13px;
            margin-bottom:30px;
        }

        .sidebar a{
            display:block;
            color:white;
            text-decoration:none;
            padding:12px;
            border-radius:10px;
            margin-bottom:10px;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:#38bdf8;
        }

        /* MAIN CONTENT */

        .main-content{
            margin-left:260px;
            padding:30px;
        }

        /* CARDS */

        .card-box{
            background:#1e293b;
            padding:25px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 5px 20px rgba(0,0,0,0.3);
        }

        .card-box h5{
            color:#cbd5e1;
        }

        .card-box h2{
            margin-top:15px;
            font-size:40px;
            font-weight:700;
        }

        /* CHART */

        .chart-container{
            margin-top:40px;
            background:#1e293b;
            padding:30px;
            border-radius:20px;
        }

        canvas{
            max-width:500px;
            margin:auto;
        }

    </style>

</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <h2>VenGuard AI</h2>

        <p>
            Smart Vendor Risk Intelligence
        </p>

        <a href="/dashboard">Dashboard</a>

        <a href="/vendors">Vendors</a>

        <a href="/add_vendor">Add Vendor</a>

        <a href="/documents">Documents</a>

        <a href="/logout">Logout</a>

    </div>

    <!-- MAIN CONTENT -->

    <div class="main-content">

        <h1 class="mb-5">
            Welcome {{ name }}
        </h1>

        <!-- CARDS -->

        <div class="row g-4">

            <div class="col-md-3">

                <div class="card-box">

                    <h5>Total Vendors</h5>

                    <h2>{{ total_vendors }}</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card-box">

                    <h5>High Risk</h5>

                    <h2>{{ high_risk }}</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card-box">

                    <h5>Medium Risk</h5>

                    <h2>{{ medium_risk }}</h2>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card-box">

                    <h5>Low Risk</h5>

                    <h2>{{ low_risk }}</h2>

                </div>

            </div>

        </div>

        <!-- CHART -->

        <div class="chart-container">

            <h3 class="mb-4">
                Vendor Risk Analytics
            </h3>

            <canvas id="riskChart"></canvas>

        </div>

    </div>

    <!-- CHART SCRIPT -->

    <script>

        const chartElement = document.getElementById('riskChart');

        const riskChart = new Chart(chartElement, {

            type: 'doughnut',

            data: {

                labels: [
                    'High Risk',
                    'Medium Risk',
                    'Low Risk'
                ],

                datasets: [{

                    label: 'Vendor Risks',

                    data: [
                        Number('{{ high_risk }}'),
                        Number('{{ medium_risk }}'),
                        Number('{{ low_risk }}')
                    ],

                    backgroundColor: [
                        '#ef4444',
                        '#f59e0b',
                        '#22c55e'
                    ],

                    borderWidth: 2

                }]
            },

            options: {

                responsive: true,

                plugins: {

                    legend: {

                        labels: {

                            color: 'white',
                            font: {
                                size: 14
                            }

                        }

                    }

                }

            }

        });

    </script>

</body>

</html>
