<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendors | VenGuard AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Poppins;
        }

        .container{
            margin-top:50px;
        }

        table{
            background:#1e293b;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1 class="text-info mb-4">
            VenGuard AI Vendors
        </h1>

        <table class="table table-dark table-hover">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Company</th>

                    <th>Service</th>

                    <th>Risk</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

                {% for vendor in vendors %}

                <tr>

                    <td>{{ vendor[0] }}</td>

                    <td>{{ vendor[1] }}</td>

                    <td>{{ vendor[2] }}</td>

                    <td>{{ vendor[3] }}</td>

                    <td>{{ vendor[4] }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>

</html>
