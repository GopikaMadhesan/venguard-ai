<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VenGuard AI</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background:#0f172a;
            color:white;
        }

        /* NAVBAR */

        .navbar{
            background:#020617;
            padding:15px 30px;
            box-shadow:0 4px 10px rgba(0,0,0,0.3);
        }

        .navbar-brand{
            font-size:28px;
            font-weight:700;
            color:#38bdf8 !important;
        }

        .tagline{
            font-size:12px;
            color:#94a3b8;
        }

        .nav-link{
            color:white !important;
            margin-left:15px;
            transition:0.3s;
            font-weight:500;
        }

        .nav-link:hover{
            color:#38bdf8 !important;
        }

        /* MAIN CONTENT */

        .main-content{
            padding:30px;
        }

        /* FOOTER */

        footer{
            background:#020617;
            color:#94a3b8;
            text-align:center;
            padding:15px;
            margin-top:40px;
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="/dashboard">

                VenGuard AI

                <div class="tagline">
                    Smart Vendor Risk Intelligence
                </div>

            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/dashboard">

                            <i class="bi bi-speedometer2"></i>
                            Dashboard

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/vendors">

                            <i class="bi bi-buildings"></i>
                            Vendors

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/add_vendor">

                            <i class="bi bi-plus-circle"></i>
                            Add Vendor

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/documents">

                            <i class="bi bi-file-earmark-text"></i>
                            Documents

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/logout">

                            <i class="bi bi-box-arrow-right"></i>
                            Logout

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- MAIN CONTENT -->

    <div class="main-content">

        {% block content %}

        {% endblock %}

    </div>

    <!-- FOOTER -->

    <footer>

        © 2026 VenGuard AI | Smart Vendor Risk Intelligence

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
